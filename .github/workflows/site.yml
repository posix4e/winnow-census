name: Site

# Deploys the page and the data as a Cloudflare Worker with static assets
# (wrangler.jsonc). The Worker's custom domain, census.winnowwallet.com, is
# created by Cloudflare on deploy along with its DNS record and certificate;
# nothing is configured by hand.
#   push to main      -> deploy
#   workflow_dispatch -> the same, for the first deploy and for reruns
#
# The daily census job deploys itself after committing a data point, because a
# push made with the workflow token does not trigger this workflow.
#
# Requires repo secrets: CF_API_TOKEN made from the "Edit Cloudflare Workers"
# template with the winnowwallet.com zone included (see README), and
# CF_ACCOUNT_ID.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "census/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assemble the site
        # Only the page and the data are published; the tool's sources and
        # this workflow are not part of the site.
        run: |
          rm -rf site && mkdir site
          cp index.html site/
          cp -r census site/census

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.125.0"
          command: deploy
